#!name=95 Disable QUIC
#!desc=Optional compatibility rule that blocks UDP 443 and forces TCP fallback
#!author=Sergey Nazarov
#!updated=2026-08-04

[Rule]
# Blocking UDP/443 disables QUIC/HTTP3 and forces applications to retry over TCP.
# Enable only for troubleshooting; video streams and calls may become slower.
AND,((PROTOCOL,UDP),(DEST-PORT,443)),REJECT
