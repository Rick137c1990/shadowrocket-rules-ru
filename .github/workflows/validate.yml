name: Validate rules

run-name: Build and validate rules — ${{ github.ref_name }}

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Build, test, validate, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Rebuild profiles
        run: ./scripts/build-configs.sh

      - name: Validate and lint rules
        run: ./scripts/validate-configs.sh

      - name: Verify generated profiles are committed
        run: git diff --exit-code
