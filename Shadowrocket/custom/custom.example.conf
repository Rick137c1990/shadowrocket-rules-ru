#!name=My Custom Rules
#!desc=Personal routing exceptions; copy and rename this file

[Rule]
# Exact hostname through proxy
DOMAIN,api.example.com,PROXY

# Domain and all subdomains through proxy
DOMAIN-SUFFIX,example.com,PROXY

# Direct exception; keep narrow exceptions above broader rules
DOMAIN,direct.example.net,DIRECT

# IPv4 network without DNS resolution
IP-CIDR,203.0.113.0/24,PROXY,no-resolve
